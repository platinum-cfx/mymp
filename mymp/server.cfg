# ============================================
#  MyMP server configuration
#  (your own multiplayer platform for GTA V)
# ============================================

# Where the server listens.
#   TCP 30120 -> HTTP web client + WebSocket (browser players)
#   UDP 30120 -> native client traffic (the GTA V client)
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "MyMP - your own multiplayer"
sv_maxclients 64

# License key. Generated automatically on first run if left as 'changeme'.
sv_licenseKey changeme

# Number of AI cars driving around (0 to disable)
bots 6

# OneSync-style population management: max entities streamed to any player
# (players are always included; AI is prioritised by distance)
sv_maxEntitiesPerPlayer 48

# ------------------------------------------------------------
# Permissions (aces) — same model as FiveM's ACL:
#   add_ace <group>.<object> allow|deny
#   add_principal identifier.name:<Name> group.<group>
# A player is matched by longest prefix; deny beats allow; default deny.
# ------------------------------------------------------------
# Give admins every command:
add_ace group.admin command allow
# ...but not the ability to quit the server from chat:
add_ace group.admin command.quit deny
# Make specific players admins (case-sensitive, matches their name):
add_principal identifier.name:Admin group.admin
# Everyone may use the harmless instance command:
add_ace group.user command.instance allow
# Everyone may spawn/delete vehicles (demo-friendly; remove to restrict):
add_ace group.user command.veh allow
add_ace group.user command.dv allow
# Freeroam weapons/heal for everyone (demo-friendly):
add_ace group.user command.weapon allow
add_ace group.user command.map allow
add_principal identifier.group:user group.user

# Primary language of the server
sets locale "en-US"

# Auto-generated on 2026-08-31:
sv_licenseKey mymp-cc56e32258292833

# announce to a master list so the launcher's Server Browser finds this server:
# (run:  python3 server/registry.py --port 30130)
sv_masterlist http://localhost:30130
