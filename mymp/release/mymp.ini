; mymp.ini — MyMP GTA V client configuration
; Copy this file into your GTA V folder next to MyMP.asi and edit as needed.

[server]
; IP or hostname of your MyMP server (use 127.0.0.1 for the same PC)
host=127.0.0.1
port=30120

[player]
; name shown to other players
name=GTA-Player
; vehicle model spawned when you join (any GTA V vehicle name)
vehicle=adder
; your vehicle colour as #RRGGBB
color=#ff9f1c
