<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyMP — Server Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent:#ff9f1c; --bg:#0b0e14; --panel:#0f131c; --line:rgba(255,255,255,.10); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:#e8ecf3; font-family:"Segoe UI",system-ui,Arial,sans-serif;
         min-height:100vh; padding:26px; }
  h1 { font-size:22px; margin-bottom:4px; } h1 b { color:var(--accent); }
  .sub { opacity:.55; font-size:12.5px; margin-bottom:20px; }
  .add { display:flex; gap:8px; margin-bottom:22px; max-width:640px; }
  input { flex:1; background:#0d1119; border:1px solid var(--line); color:#e8ecf3;
          border-radius:9px; padding:10px 13px; font-size:13.5px; outline:none; }
  input:focus { border-color:var(--accent); }
  button { background:var(--accent); color:#14100a; border:0; border-radius:9px;
           padding:10px 18px; font-weight:700; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:18px; }
  .card .name { font-size:16px; font-weight:700; margin-bottom:4px; }
  .card .meta { font-size:12px; opacity:.6; margin-bottom:12px; }
  .bar { height:6px; background:#121826; border-radius:99px; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .row { display:flex; justify-content:space-between; align-items:center; }
  .dead { opacity:.45; } .dead .name { color:#ff6b6b; }
</style>
</head>
<body>
<h1>My<b>MP</b> — Server Browser</h1>
<div class="sub">Enter server addresses (with port) to see live info and join. This page works on any MyMP server.</div>
<div class="add">
  <input id="addr" placeholder="http://127.0.0.1:30120" value="http://127.0.0.1:30120">
  <button onclick="addServer()">+ add</button>
</div>
<div class="grid" id="grid"></div>

<script>
(() => {
"use strict";
const grid = document.getElementById('grid');
const servers = new Map();   // url -> {info, dead}

function defaultList(){
  const here = location.host;
  return here ? ['http://' + here] : ['http://127.0.0.1:30120'];
}
function loadList(){
  const saved = localStorage.getItem('mymp_hub');
  return saved ? JSON.parse(saved) : defaultList();
}
function saveList(){
  localStorage.setItem('mymp_hub', JSON.stringify([...servers.keys()]));
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

window.addServer = function(){
  let u = document.getElementById('addr').value.trim().replace(/\/+$/,'');
  if (!/^https?:\/\//i.test(u)) u = 'http://' + u;
  if (!servers.has(u)){ servers.set(u, null); saveList(); }
  document.getElementById('addr').value = '';
};

async function poll(){
  for (const url of servers.keys()){
    try {
      const res = await fetch(url + '/info.json', { cache:'no-store' });
      if (!res.ok) throw new Error('http ' + res.status);
      servers.set(url, { info: await res.json(), dead: false });
    } catch (e) {
      const prev = servers.get(url);
      servers.set(url, { info: prev && prev.info, dead: true });
    }
  }
  render();
}
function render(){
  grid.innerHTML = '';
  for (const [url, s] of servers){
    const card = document.createElement('div');
    card.className = 'card' + (s && s.dead ? ' dead' : '');
    if (!s || !s.info){
      card.innerHTML = '<div class="name">' + esc(url) + '</div><div class="meta">connecting…</div>';
      grid.appendChild(card);
      continue;
    }
    const i = s.info;
    const pct = i.maxclients ? Math.min(100, Math.round(i.players / i.maxclients * 100)) : 0;
    card.innerHTML =
      '<div class="name">' + esc(i.hostname || url) + (s.dead ? ' <span style="font-size:11px">(offline)</span>' : '') + '</div>' +
      '<div class="meta">' + esc(url) + ' · v' + esc(i.version || '?') + ' · ' + (i.bots|0) + ' AI</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="row"><span>' + (i.players|0) + ' / ' + (i.maxclients||'?') + ' players</span>' +
      (s.dead ? '' : '<a href="' + esc(url) + '/" target="_blank" rel="noopener" ' +
        'style="color:var(--accent);font-weight:700;font-size:13px">JOIN →</a>') + '</div>' +
      (i.resources ? '<div class="meta" style="margin-top:8px;margin-bottom:0">' +
        (i.resources.map(r=>r.name).join(', ')) + '</div>' : '');
    grid.appendChild(card);
  }
}

for (const u of loadList()) servers.set(u, null);
saveList();
poll();
setInterval(poll, 5000);
})();
</script>
</body>
</html>
