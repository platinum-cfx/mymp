<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MyMP — your own multiplayer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent:#ff9f1c; --bg:#0b0e14; --panel:rgba(15,19,28,.92); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:#e8ecf3;
              font-family:"Segoe UI",system-ui,Arial,sans-serif; }
  #canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #speedo { position:fixed; right:22px; bottom:22px; width:118px; height:118px;
            background:radial-gradient(circle at 50% 42%, rgba(255,255,255,.06), rgba(0,0,0,.55));
            border:2px solid rgba(255,255,255,.14); border-radius:50%;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            backdrop-filter:blur(4px); }
  #speedo b { font-size:30px; font-weight:700; letter-spacing:1px; }
  #speedo span { font-size:10px; opacity:.65; letter-spacing:2px; text-transform:uppercase; }
  #minimap { position:fixed; right:22px; top:22px; width:200px; height:200px;
             border:2px solid rgba(255,255,255,.16); border-radius:12px; overflow:hidden;
             background:rgba(8,11,17,.72); box-shadow:0 8px 30px rgba(0,0,0,.5); }
  #minimap canvas { width:100%; height:100%; display:block; }
  #players { position:fixed; right:22px; top:236px; width:200px; max-height:38%;
             overflow:hidden; font-size:12.5px; line-height:1.7;
             background:var(--panel); border:1px solid rgba(255,255,255,.10);
             border-radius:10px; padding:10px 12px; }
  #players b { display:block; font-size:10px; letter-spacing:2px; opacity:.55; margin-bottom:4px;
               text-transform:uppercase; }
  #players .row { display:flex; align-items:center; gap:7px; }
  #players .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  #banner { position:fixed; top:22px; left:22px; background:var(--panel);
            border:1px solid rgba(255,255,255,.12); border-left:4px solid var(--accent);
            border-radius:10px; padding:10px 16px; font-size:14px; z-index:20; }
  #banner b { color:var(--accent); font-size:15px; }
  #banner small { display:block; opacity:.55; font-size:11px; margin-top:2px; }
  #hint { position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
          background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.12);
          padding:8px 16px; border-radius:999px; font-size:12.5px; opacity:.85;
          backdrop-filter:blur(4px); pointer-events:none; }

  /* ---------- join screen ---------- */
  #join { position:fixed; inset:0; z-index:30; display:flex; align-items:center;
          justify-content:center; background:radial-gradient(1200px 700px at 50% 30%,
          #141b2b 0%, #0b0e14 65%); }
  #join .card { width:min(420px,92vw); background:var(--panel); border:1px solid
                rgba(255,255,255,.10); border-radius:18px; padding:34px 34px 28px;
                box-shadow:0 24px 80px rgba(0,0,0,.6); }
  #join h1 { font-size:26px; letter-spacing:.5px; }
  #join h1 b { color:var(--accent); }
  #join .sub { opacity:.55; font-size:12.5px; margin:6px 0 24px; }
  #join label { display:block; font-size:11px; letter-spacing:1.5px; opacity:.6;
                text-transform:uppercase; margin:14px 0 6px; }
  #join input[type=text], #join input[type=color] { width:100%; background:#0d1119;
                border:1px solid rgba(255,255,255,.14); color:#e8ecf3; border-radius:9px;
                padding:11px 13px; font-size:14px; outline:none; }
  #join input[type=text]:focus { border-color:var(--accent); }
  #join .colourrow { display:flex; gap:10px; align-items:center; }
  #join .colourrow input[type=color] { flex:0 0 64px; height:42px; padding:3px; }
  #join .colourrow input[type=text] { flex:1; }
  #btnJoin { width:100%; margin-top:22px; background:var(--accent); color:#14100a;
             border:0; border-radius:10px; padding:13px; font-size:15px; font-weight:700;
             cursor:pointer; letter-spacing:.5px; }
  #btnJoin:hover { filter:brightness(1.1); }
  #joinStatus { margin-top:12px; font-size:12.5px; text-align:center; height:16px; }
  #joinStatus.err { color:#ff6b6b; } #joinStatus.ok { color:#51cf66; }

  /* ---------- chat ---------- */
  #chat { position:fixed; left:22px; bottom:22px; width:min(460px,calc(100vw - 44px));
          z-index:20; font-size:13.5px; }
  #chat .lines { display:flex; flex-direction:column; gap:2px; margin-bottom:8px;
                 pointer-events:none; text-shadow:0 1px 3px rgba(0,0,0,.9); }
  #chat .lines div { background:rgba(0,0,0,.42); padding:3px 9px; border-radius:6px;
                     width:fit-content; max-width:100%; backdrop-filter:blur(3px); }
  #chat .lines .sys { color:#9fd8ff; } #chat .lines .me { color:#ffd43b; font-style:italic; }
  #chat input { width:100%; background:rgba(10,13,20,.85); border:1px solid rgba(255,255,255,.16);
                border-radius:9px; color:#e8ecf3; padding:10px 13px; font-size:14px;
                outline:none; display:none; }
  #chat input:focus { border-color:var(--accent); }
  #chat input.show { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="banner"><b id="svHost">MyMP</b><small id="svInfo">connecting…</small></div>

<div id="hud">
  <div id="minimap"><canvas id="mm" width="400" height="400"></canvas></div>
  <div id="players"><b>Players</b><div id="plist"></div></div>
  <div id="speedo"><b id="kmh">0</b><span>km/h</span></div>
</div>

<div id="hint">WASD / arrows — drive&nbsp;&nbsp;•&nbsp;&nbsp;T — chat&nbsp;&nbsp;•&nbsp;&nbsp;/help</div>

<div id="chat">
  <div class="lines" id="lines"></div>
  <input id="chatInput" maxlength="200" placeholder="Say something… (Enter to send, Esc to close)">
</div>

<div id="join">
  <div class="card">
    <h1>My<b>MP</b></h1>
    <div class="sub">Your own multiplayer platform for GTA V — server-authoritative world, live players, chat, AI traffic.</div>
    <label>Name</label>
    <input id="name" type="text" maxlength="24" value="Player" autocomplete="off">
    <label>Vehicle colour</label>
    <div class="colourrow">
      <input id="color" type="color" value="#ff9f1c">
      <input id="colorHex" type="text" maxlength="7" value="#ff9f1c" spellcheck="false">
    </div>
    <button id="btnJoin">JOIN SERVER</button>
    <div id="joinStatus"></div>
    <button id="btnMic" disabled style="margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid #333;background:#1a1f2a;color:#ccc;cursor:pointer">🎙 Voice: off — click to enable after joining</button>
    <div class="sub" style="text-align:center;margin:14px 0 0">
      <a href="hub.html" style="color:var(--accent);text-decoration:none;font-weight:600">🌐 Browse servers</a>
      &nbsp;·&nbsp; <a href="/info.json" style="color:var(--accent);text-decoration:none;font-weight:600">server info</a>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

/* ---------------- world state ---------------- */
const world = { me: null, ents: new Map(),
  // render state per entity: smoothed x/y/h chasing the latest snapshot target
  // (design from GTANetworkDev/platform, MIT — Interpolation.cs / Interpolator.cs;
  //  our own implementation: exponential chase + heading extrapolation when stale)
  render: new Map() };
const keys = { up:false, down:false, left:false, right:false };
let ws = null;
let chatOpen = false;

/* ---------------- boot ---------------- */
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize); resize();

/* ---------------- join ---------------- */
document.getElementById('color').addEventListener('input', e => {
  document.getElementById('colorHex').value = e.target.value.toUpperCase();
});
document.getElementById('colorHex').addEventListener('input', e => {
  const v = e.target.value;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('color').value = v;
});
document.getElementById('btnJoin').addEventListener('click', join);
document.getElementById('btnMic').addEventListener('click', () => {
  if (voice.talk) stopVoice();
  else startVoice();
});
document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });

function join() {
  const name = document.getElementById('name').value.trim() || 'Player';
  const color = document.getElementById('color').value;
  const status = document.getElementById('joinStatus');
  status.className = ''; status.textContent = 'connecting…';
  try {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  } catch (err) {
    status.className = 'err'; status.textContent = 'WebSocket failed: ' + err.message; return;
  }
  ws.onopen = () => ws.send(JSON.stringify({ t:'join', name, color }));
  ws.onclose = () => {
    status.className = 'err';
    if (world.me) { status.textContent = 'connection lost — refresh to rejoin'; }
    else status.textContent = 'could not connect — is the server running?';
  };
  ws.onmessage = ev => {
    if (ev.data instanceof Blob || ev.data instanceof ArrayBuffer) {
      const buf = ev.data instanceof Blob ? ev.data : new Blob([ev.data]);
      buf.arrayBuffer().then(playVoicePacket);
    } else handle(JSON.parse(ev.data));
  };
}

/* ---------------- protocol handling ---------------- */
function handle(m) {
  switch (m.t) {
    case 'hello':
      world.me = m;
      document.getElementById('svHost').textContent = m.hostname || 'MyMP';
      document.getElementById('svInfo').textContent =
        `you are ${m.name} (#${m.id}) · max ${m.maxclients} players`;
      document.getElementById('join').style.display = 'none';
      system(`Welcome, ${m.name}! Drive with WASD. Type /help for commands.`);
      break;
    case 'state':
      const seen = new Set();
      const nowMs = performance.now();
      for (const e of m.ents) {
        seen.add(e.i);
        world.ents.set(e.i, e);
        const prev = world.render.get(e.i);
        world.render.set(e.i, {
          x: prev ? prev.x : e.x, y: prev ? prev.y : e.y, h: prev ? prev.h : e.h,
          tx: e.x, ty: e.y, th: e.h, t: nowMs, spd: e.s || 0
        });
      }
      for (const [id, e] of world.ents) if (!seen.has(id) && id !== world.me.id) world.ents.delete(id);
      for (const id of world.render.keys()) if (!seen.has(id)) world.render.delete(id);
      break;    case 'join':
      if (m.id !== world.me.id) system(m.name + ' joined.');
      break;
    case 'leave':
      world.ents.delete(m.id);
      world.render.delete(m.id);
      system('A player left.');
      break;
    case 'chat':
      if (m.me) addLine(m.name + ' ' + m.msg, 'me');
      else addLine('<b style="color:' + esc(m.color) + '">' + esc(m.name) + ':</b> ' + esc(m.msg));
      break;
    case 'pm':
      addLine('<span class="sys">[whisper] <b style="color:' + esc(m.color || '#ffd43b') + '">' + esc(m.name) + ':</b> ' + esc(m.msg) + '</span>');
      break;
    case 'event':
      handleEvent(m.name, m.data || {});
      break;
    case 'sys':
      system(m.msg);
      break;
  }
}

/* server-driven events (like TriggerClientEvent) */
function handleEvent(name, data) {
  switch (name) {
    case 'spawnVehicle':
      system('Spawning ' + (data.model || '?') + ' in the GTA client…');
      break;
    case 'setVehicle':
      system('Your saved vehicle: ' + (data.model || '?') + ' (GTA client)');
      break;
    case 'deleteVehicle':
      system('Vehicle deleted (GTA client).');
      break;
    default:
      system('event: ' + name);
  }
  window.dispatchEvent(new CustomEvent('mymp:' + name, { detail: data }));
}

/* ---------------- chat ---------------- */
const linesEl = document.getElementById('lines');
const input = document.getElementById('chatInput');
function system(msg){ addLine('<span class="sys">' + esc(msg) + '</span>'); }
function addLine(html){
  const div = document.createElement('div');
  div.innerHTML = html;
  linesEl.appendChild(div);
  while (linesEl.children.length > 60) linesEl.removeChild(linesEl.firstChild);
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

addEventListener('keydown', e => {
  if (chatOpen) return;
  if (e.key === 't' || e.key === 'T') { openChat(); return; }
  if (e.repeat) return;
  switch (e.key) {
    case 'w': case 'W': case 'ArrowUp':    keys.up = true; break;
    case 's': case 'S': case 'ArrowDown':  keys.down = true; break;
    case 'a': case 'A': case 'ArrowLeft':  keys.left = true; break;
    case 'd': case 'D': case 'ArrowRight': keys.right = true; break;
  }
});
addEventListener('keyup', e => {
  switch (e.key) {
    case 'w': case 'W': case 'ArrowUp':    keys.up = false; break;
    case 's': case 'S': case 'ArrowDown':  keys.down = false; break;
    case 'a': case 'A': case 'ArrowLeft':  keys.left = false; break;
    case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
  }
});
function openChat(){ chatOpen = true; input.classList.add('show'); input.focus(); }
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const text = input.value.trim();
    input.value = '';
    closeChat();
    if (text && ws) ws.send(JSON.stringify({ t:'chat', msg:text }));
  } else if (e.key === 'Escape') { input.value = ''; closeChat(); }
});
function closeChat(){ chatOpen = false; input.classList.remove('show'); }

/* ---------------- input loop ---------------- */
setInterval(() => {
  if (!ws || ws.readyState !== 1 || !world.me || chatOpen) return;
  ws.send(JSON.stringify({ t:'input',
    u: keys.up ? 1 : 0, d: keys.down ? 1 : 0,
    l: keys.left ? 1 : 0, r: keys.right ? 1 : 0 }));
}, 100);

/* ---------------- rendering ---------------- */
const TAU = Math.PI * 2;
function project(x, y){ // world -> screen (y down = north up, standard top-down)
  return [ W/2 + (x - world.me.x), H/2 + (y - world.me.y) ];
}
function rotate(px, py, ang){
  const c = Math.cos(ang), s = Math.sin(ang);
  return [ px*c - py*s, px*s + py*c ];
}

function drawWorld(dt){
  // custom map objects (asset streaming lite) — static props
  ctx.save();
  for (const e of world.ents.values()) {
    if ((e.kind || e.k) !== 'obj') continue;
    const [sx, sy] = project(e.x, e.y);
    const size = Math.max(5, 18 - (e.x - world.me.x) / 60);
    ctx.fillStyle = 'rgba(255,159,28,0.5)';
    ctx.strokeStyle = 'rgba(255,159,28,0.9)';
    ctx.lineWidth = 1.5;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate((e.h || 0) * Math.PI / 180);
    ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.strokeRect(-size / 2, -size / 2, size, size);
    ctx.restore();
  }
  ctx.restore();
  // ground
  ctx.fillStyle = '#10151d';
  ctx.fillRect(0, 0, W, H);

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  const gs = 100;
  const ox = Math.floor(world.me.x / gs) * gs, oy = Math.floor(world.me.y / gs) * gs;
  for (let gx = ox - 8*gs; gx <= ox + 8*gs; gx += gs) {
    const [sx] = project(gx, 0);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
  }
  for (let gy = oy - 8*gs; gy <= oy + 8*gs; gy += gs) {
    const [, sy] = project(0, gy);
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke();
  }

  // roads (two main avenues crossing at the origin)
  ctx.strokeStyle = 'rgba(60,70,90,0.85)';
  ctx.lineWidth = 26;
  for (const a of [0, Math.PI/2]) {
    const sx = project(world.me.x + Math.cos(a)*4000, world.me.y + Math.sin(a)*4000);
    const ex = project(world.me.x - Math.cos(a)*4000, world.me.y - Math.sin(a)*4000);
    ctx.beginPath(); ctx.moveTo(sx[0], sx[1]); ctx.lineTo(ex[0], ex[1]); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.lineWidth = 2;
  for (const a of [0, Math.PI/2]) {
    const sx = project(world.me.x + Math.cos(a)*4000, world.me.y + Math.sin(a)*4000);
    const ex = project(world.me.x - Math.cos(a)*4000, world.me.y - Math.sin(a)*4000);
    ctx.setLineDash([26, 26]);
    ctx.beginPath(); ctx.moveTo(sx[0], sx[1]); ctx.lineTo(ex[0], ex[1]); ctx.stroke();
    ctx.setLineDash([]);
  }

  // buildings
  ctx.fillStyle = 'rgba(30,38,52,0.9)';
  for (let i = 0; i < 26; i++) {
    const seed = i * 97.3;
    const bx = Math.round((Math.sin(seed*1.3) * 1500) / 220) * 220 + 60;
    const by = Math.round((Math.cos(seed*0.9) * 1500) / 220) * 220 + 60;
    if (Math.abs(bx - world.me.x) > 1700 || Math.abs(by - world.me.y) > 1700) continue;
    const [sx, sy] = project(bx, by);
    const s = 44 + (i % 3) * 16;
    ctx.fillRect(sx - s/2, sy - s/2, s, s);
  }

  // entities
  const list = [...world.ents.values()];
  list.sort((a, b) => Math.abs(a.x - world.me.x) + Math.abs(a.y - world.me.y)
                  - (Math.abs(b.x - world.me.x) + Math.abs(b.y - world.me.y)));
  for (const e of list) {
    if (e.f) drawPed(e);      // player on foot
    else drawCar(e);          // in a vehicle
  }
  if (world.me) drawCar({ id: world.me.id, kind:'player', x: world.me.spawn[0],
                          y: world.me.spawn[1], h: world.me.spawn[2],
                          s: 0, n: world.me.name, c: world.me.color, me:true });

  // heading marker
  const [mx, my] = project(world.me.x, world.me.y);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(mx, my, 34, 0, TAU); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(mx + Math.sin(world.me.spawn[2])*34, my - Math.cos(world.me.spawn[2])*34, 3.5, 0, TAU); ctx.fill();
}

/* health/armour bar (server syncs hp/ar for every player) */
function drawHealthBar(sx, sy, e){
  if (e.hp === undefined) return;
  const w = 40, h = 4;
  const x = sx - w/2, y = sy - 24;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  const pct = Math.max(0, Math.min(100, e.hp)) / 100;
  ctx.fillStyle = pct > 0.6 ? '#51cf66' : pct > 0.3 ? '#ffd43b' : '#ff6b6b';
  ctx.fillRect(x, y, w * pct, h);
  if (e.ar > 0) {
    ctx.fillStyle = 'rgba(64,196,255,0.9)';
    ctx.fillRect(x, y - 5, w * Math.min(1, e.ar / 100), 3);
  }
}

function drawCar(e){
  const [sx, sy] = project(e.x, e.y);
  drawHealthBar(sx, sy, e);
  const s = 1 + Math.min(1.6, Math.abs(e.s) / 430) * 0.55;
  const len = 42 * s, wid = 20 * s;
  const [fx, fy] = rotate(len/2, 0, e.h);
  const [bx, by] = rotate(-len/2, 0, e.h);
  const [lx, ly] = rotate(0, -wid/2, e.h);
  const [rx, ry] = rotate(0, wid/2, e.h);
  const pts = [[fx[0],fy[0]],[lx[0],ly[0]],[bx[0],by[0]],[rx[0],ry[0]]];

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.moveTo(sx+pts[0][0]+3, sy+pts[0][1]+3);
  for (let i=1;i<4;i++) ctx.lineTo(sx+pts[i][0]+3, sy+pts[i][1]+3);
  ctx.closePath(); ctx.fill();

  // body
  ctx.fillStyle = e.c;
  ctx.beginPath();
  ctx.moveTo(sx+pts[0][0], sy+pts[0][1]);
  for (let i=1;i<4;i++) ctx.lineTo(sx+pts[i][0], sy+pts[i][1]);
  ctx.closePath(); ctx.fill();

  // roof
  const rr = 0.55;
  const roof = [[fx[0]*rr,fy[0]*rr],[lx[0]*rr,ly[0]*rr],[bx[0]*rr,by[0]*rr],[rx[0]*rr,ry[0]*rr]];
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath();
  ctx.moveTo(sx+roof[0][0], sy+roof[0][1]);
  for (let i=1;i<4;i++) ctx.lineTo(sx+roof[i][0], sy+roof[i][1]);
  ctx.closePath(); ctx.fill();

  // headlights
  ctx.fillStyle = '#fff3b0';
  const [hl1, hl2] = [rotate(len/2-3, -wid/2+5, e.h), rotate(len/2-3, wid/2-5, e.h)];
  ctx.beginPath(); ctx.arc(sx+hl1[0], sy+hl1[1], 2.6*s, 0, TAU); ctx.arc(sx+hl2[0], sy+hl2[1], 2.6*s, 0, TAU); ctx.fill();
  // taillights
  ctx.fillStyle = '#ff5252';
  const [tl1, tl2] = [rotate(-len/2+3, -wid/2+5, e.h), rotate(-len/2+3, wid/2-5, e.h)];
  ctx.beginPath(); ctx.arc(sx+tl1[0], sy+tl1[1], 2.2*s, 0, TAU); ctx.arc(sx+tl2[0], sy+tl2[1], 2.2*s, 0, TAU); ctx.fill();

  // name label
  ctx.font = '12px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const tw = ctx.measureText(e.n).width;
  ctx.fillRect(sx - tw/2 - 5, sy - len/2 - 22, tw + 10, 17);
  ctx.fillStyle = '#fff';
  ctx.fillText(e.n, sx, sy - len/2 - 9);
  // state bag tag (e.g. /tag MyTag)
  if (e.d && e.d.tag) {
    const tag = String(e.d.tag).slice(0, 24);
    ctx.font = '10.5px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    const tw2 = ctx.measureText(tag).width;
    ctx.fillStyle = 'rgba(255,159,28,0.18)';
    ctx.fillRect(sx - tw2/2 - 4, sy - len/2 - 39, tw2 + 8, 15);
    ctx.strokeStyle = 'rgba(255,159,28,0.55)';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx - tw2/2 - 4, sy - len/2 - 39, tw2 + 8, 15);
    ctx.fillStyle = '#ffd43b';
    ctx.fillText(tag, sx, sy - len/2 - 28);
  }
}

/* player on foot — a circle with a direction nub + name */
function drawPed(e){
  const [sx, sy] = project(e.x, e.y);
  drawHealthBar(sx, sy, e);
  const r = 9;
  ctx.beginPath(); ctx.arc(sx + 1.5, sy + 1.5, r, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fillStyle = e.c; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.stroke();
  const nx = sx + Math.sin(e.h) * (r + 5), ny = sy - Math.cos(e.h) * (r + 5);
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(nx, ny);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.font = '12px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  const tw = ctx.measureText(e.n).width;
  ctx.fillRect(sx - tw/2 - 5, sy - r - 20, tw + 10, 17);
  ctx.fillStyle = '#fff';
  ctx.fillText(e.n, sx, sy - r - 7);
}

/* ---------------- minimap + player list ---------------- */
const mm = document.getElementById('mm').getContext('2d');
function drawMinimap(){
  const S = 400, R = 700, scale = S / (R * 2);
  mm.fillStyle = 'rgba(10,14,20,0.9)';
  mm.fillRect(0, 0, S, S);
  mm.strokeStyle = 'rgba(255,255,255,0.08)';
  mm.lineWidth = 2;
  mm.beginPath(); mm.arc(S/2, S/2, S/2, 0, TAU); mm.stroke();
  mm.save();
  mm.beginPath(); mm.arc(S/2, S/2, S/2 - 2, 0, TAU); mm.clip();
  for (const e of world.ents.values()) {
    const dx = (e.x - world.me.x), dy = (e.y - world.me.y);
    if (Math.abs(dx) > R || Math.abs(dy) > R) continue;
    mm.fillStyle = e.c;
    mm.beginPath(); mm.arc(S/2 + dx*scale, S/2 + dy*scale, e.kind === 'bot' ? 4 : 6, 0, TAU); mm.fill();
  }
  mm.restore();
  mm.fillStyle = '#fff';
  mm.beginPath(); mm.arc(S/2, S/2, 5, 0, TAU); mm.fill();
  mm.strokeStyle = '#fff'; mm.lineWidth = 2;
  mm.beginPath(); mm.arc(S/2, S/2, 5, 0, TAU); mm.stroke();
}

function updatePlayers(){
  const rows = [];
  for (const e of world.ents.values()) {
    if (e.kind !== 'player') continue;
    rows.push('<div class="row"><span class="dot" style="background:' + e.c + '"></span>' +
              '<span>' + esc(e.n) + (e.i === world.me.id ? ' (you)' : '') + '</span></div>');
  }
  rows.sort();
  document.getElementById('plist').innerHTML = rows.join('') || '<div style="opacity:.5">empty…</div>';
}

/* ---------------- remote-entity interpolation ----------------
   GTA:Network's approach (MIT): keep a timestamped snapshot stream and
   render between snapshots on a short delay instead of snapping to each
   10 Hz update. Ours: exponential chase (tau ~90 ms) + heading-based
   extrapolation when updates are stale. */
function advanceRender(dt){
  const nowMs = performance.now();
  for (const [id, r] of world.render) {
    const e = world.ents.get(id);
    if (!e) { world.render.delete(id); continue; }
    let tx = r.tx, ty = r.ty;
    if (nowMs - r.t > 250 && r.spd > 0.1) {          // extrapolate while stale
      const ex = (nowMs - r.t) / 1000;
      tx += Math.cos(r.th * Math.PI / 180) * r.spd * ex;
      ty += Math.sin(r.th * Math.PI / 180) * r.spd * ex;
    }
    const k = 1 - Math.exp(-dt / 0.09);              // ~67% of the gap per 90 ms
    r.x += (tx - r.x) * k;
    r.y += (ty - r.y) * k;
    let d = ((r.th - r.h) % 360 + 540) % 360 - 180;  // shortest heading arc
    r.h += d * k;
    e.x = r.x; e.y = r.y; e.h = r.h;                 // draw code reads e.*
  }
}

/* ---------------- voice chat (proximity, browser-side) ----------------
   Mic capture -> 16 kHz mono Int16 PCM -> binary WS frames to the server;
   the server routes to nearby players with a volume byte (0-255) prefix.
   Playback: push incoming buffers into an AudioContext with per-packet gain.
   (Raw PCM for now; Opus is the future upgrade.) */
let voice = {
  ctx: null, stream: null, node: null, talk: false, supported: true,
  sendQueue: [], interval: null
};
function voiceLog(msg){ system(msg); }

function ensureVoiceCtx(){
  if (!voice.ctx) {
    try { voice.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { voice.supported = false; return false; }
  }
  return true;
}

function startVoice(){
  if (!voice.supported || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    voiceLog('Voice not supported in this browser (needs mic permission).');
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true,
      noiseSuppression: true, channelCount: 1 } }).then(st => {
    ensureVoiceCtx();
    if (!voice.ctx) return;
    voice.stream = st;
    voice.talk = true;
    const src = voice.ctx.createMediaStreamSource(st);
    voice.node = voice.ctx.createScriptProcessor(2048, 1, 1);
    voice.node.onaudioprocess = ev => {
      if (!voice.talk || ws.readyState !== 1) return;
      // downsample 44.1/48k -> 16k mono Int16
      const ch = ev.inputBuffer.getChannelData(0);
      const step = ev.inputBuffer.sampleRate / 16000;
      const n = Math.floor(ch.length / step);
      const buf = new DataView(new ArrayBuffer(n * 2));
      for (let i = 0; i < n; i++) {
        const v = Math.max(-1, Math.min(1, ch[Math.floor(i * step)]));
        buf.setInt16(i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
      }
      ws.send(new Uint8Array(buf.buffer));
    };
    src.connect(voice.node);
    voice.node.connect(voice.ctx.destination);
    voiceLog('🎙 Voice ON — talking now.');
    document.getElementById('btnMic').textContent = '🎙 Voice: ON (click to mute)';
    document.getElementById('btnMic').style.borderColor = '#51cf66';
  }).catch(() => voiceLog('Mic permission denied — voice stays off.'));
}

function stopVoice(){
  voice.talk = false;
  if (voice.stream) { voice.stream.getTracks().forEach(t => t.stop()); voice.stream = null; }
  if (voice.node) { voice.node.disconnect(); voice.node.onaudioprocess = null; voice.node = null; }
  voiceLog('Voice OFF.');
  document.getElementById('btnMic').textContent = '🎙 Voice: off — click to enable';
  document.getElementById('btnMic').style.borderColor = '';
}

function playVoicePacket(data){
  if (!voice.supported || !voice.talk || !voice.ctx) return;  // don't play unless we're in voice
  if (!ensureVoiceCtx() || voice.ctx.state === 'suspended') voice.ctx.resume();
  const vol = data[0] / 255;
  const pcm = data.slice(1);
  const n = Math.floor(pcm.length / 2);
  if (n < 100) return;
  const f32 = new Float32Array(n);
  for (let i = 0; i < n; i++) f32[i] = pcm[i*2] | (pcm[i*2+1] << 8);
  for (let i = 0; i < n; i++) {
    let v = f32[i];
    if (v > 0x7FFF) v = v - 0x10000;
    f32[i] = (v / 0x8000) * vol;
  }
  const ab = voice.ctx.createBuffer(1, n, 16000);
  ab.copyToChannel(f32, 0);
  const srcNode = voice.ctx.createBufferSource();
  srcNode.buffer = ab;
  srcNode.connect(voice.ctx.destination);
  srcNode.start();
}

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  advanceRender(dt);
  drawWorld(dt);
  drawMinimap();
  updatePlayers();
  // speedo
  const meEnt = world.ents.get(world.me && world.me.id);
  const kmh = Math.round(Math.abs(meEnt ? meEnt.s : 0) * 0.32);
  document.getElementById('kmh').textContent = kmh;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
